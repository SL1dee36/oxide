language = "C"
include_guard = "OXIDE_H"
autogen_warning = "/* Warning: This header is generated by cbindgen. Compatible with C99 and C++. */"
tab_width = 4
style = "type"

[export]
include = [
    "OXIDE_INVALID_NODE_ID",
    "OxideVec2",
    "OxideVec3",
    "OxideQuat",
    "OxideColor",
    "OxideTransform",
    "OxideContact",
    "OxideRaycastHit",
    "OxideApp",
    "OxideContext",
    "OxideScene",
    "OxideCallbacks",
    "OxideInitFn",
    "OxideUpdateFn",
    "OxideRenderFn",
]

[parse]
parse_deps = false
clean = false
